# Deploy from the monorepo root, not from apps/web — the Dockerfile needs the
# whole workspace as build context to resolve @easymarker/db, @easymarker/shared,
# and @easymarker/email:
#   flyctl deploy --config apps/web/fly.toml --dockerfile apps/web/Dockerfile .
#
# "easymarker-web" is a placeholder — Fly app names are globally unique across
# ALL Fly users, so this will likely need changing to something available
# before your first `flyctl apps create`.
app = "easymarker-web"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scales to zero when idle to save cost pre-launch. Set to 1 once you have
  # steady traffic and cold starts (a few seconds) become noticeable to users.
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
