services:
  postgres:
    image: postgres:16-alpine
    container_name: easymarker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: easymarker
      POSTGRES_PASSWORD: easymarker
      POSTGRES_DB: easymarker
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easymarker"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: easymarker_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: easymarker
      MINIO_ROOT_PASSWORD: easymarker123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./infra/minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 easymarker easymarker123 &&
      mc mb --ignore-existing local/easymarker-uploads
      "
