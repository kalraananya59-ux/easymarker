name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @easymarker/web typecheck
      - run: pnpm --filter @easymarker/proxy typecheck

  # Runs against the production database directly from CI. Both apps deploy
  # separately via Vercel's own GitHub integration (not this workflow), which
  # doesn't run migrations as part of its build, so this job is what keeps
  # the schema current on every push to main.
  migrate:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @easymarker/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
